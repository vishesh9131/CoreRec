# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC), so no API token is stored anywhere.
# One-time setup on pypi.org: project corerec -> Publishing -> add a trusted
# publisher for this repo, workflow "publish.yml", environment "pypi".
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # build and check only; publishing needs a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*corerec-([^-]+)-.*/\1/')
          echo "tag $tag, built $built"
          test "$tag" = "$built"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
