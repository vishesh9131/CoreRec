name: CoreRec CI

on:
  push:
    branches: [main, master, develop, "unified/*"]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Production-model tests – MUST pass before merging                   #
  # ------------------------------------------------------------------ #
  model-tests:
    name: Model tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev,serving]"
          pip install pytest pytest-cov

      - name: Install faiss (serving tests fall back to brute force without it)
        run: pip install faiss-cpu || echo "faiss-cpu unavailable; VectorIndex uses brute-force fallback"

      # One run over the whole suite. Previously this was eight overlapping steps
      # ending in a full run that --ignore'd tests/unionizedFilterEngine, which is
      # where 20 tests importing non-existent modules were hiding. No ignores now:
      # if a test is here, it runs, and a red build means something is actually broken.
      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short --strict-markers \
            --cov=corerec --cov-fail-under=40

  # ------------------------------------------------------------------ #
  # Lint – fast feedback on code quality                                #
  # ------------------------------------------------------------------ #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff check (syntax errors / undefined names)
        run: ruff check . --select=E9,F63,F7,F82 --no-fix
