site_name: CoreRec Documentation
site_description: Comprehensive documentation for CoreRec - Advanced Recommendation Systems Library
site_author: Vishesh Yadav
site_url: https://corerec.online/docs/
exclude_docs: |
  README.md

repo_name: vishesh9131/CoreRec
repo_url: https://github.com/vishesh9131/CoreRec
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 Vishesh Yadav. For research purposes only.

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
    logo: material/graph
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vishesh9131/CoreRec
      name: CoreRec on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/corerec/
      name: CoreRec on PyPI
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  version:
    provider: mike
    default: latest

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home:
    - index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Architecture: getting-started/architecture.md
  
  - API Reference:
    - api/index.md
    - Base Recommender: api/base-recommender.md
  
  - Engines:
    - engines/index.md
    - Collaborative Filtering:
      - engines/collaborative/index.md
      - Matrix Factorization: engines/collaborative/matrix-factorization.md
      - Graph Based: engines/collaborative/graph-based.md
      - Variational Encoders: engines/collaborative/variational-encoders.md
    - Deep Learning Models:
      - engines/deep-learning/index.md
      - SASRec: engines/deep-learning/sasrec.md
  
  - Core Components:
    - core/index.md
    - Towers:
      - core/towers/index.md
  
  - Utilities:
    - utilities/index.md
  
  - Examples:
    - examples/index.md
  
  - Testing:
    - testing/index.md
  
  - Contributing:
    - contributing/index.md
  
  - About:
    - about/index.md
    - Release Notes: about/release-notes.md
    - Roadmap: about/roadmap.md
    - FAQ: about/faq.md
    - License: about/license.md
    - Contact: about/contact.md
