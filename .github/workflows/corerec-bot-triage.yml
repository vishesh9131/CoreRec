name: corerec-bot triage

# Checklist, labels and the welcome note. pull_request_target runs with the
# base repo's workflow and secrets, so this job must never check out or run the
# PR's code: it only reads PR metadata through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: corerec-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in `if:`; expose whether the App key is set
      HAS_KEY: ${{ secrets.COREREC_BOT_APP_ID != '' && secrets.COREREC_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Skip when the bot isn't configured
        if: env.HAS_KEY != 'true'
        run: echo "::notice::corerec-bot is not set up (repo secrets COREREC_BOT_APP_ID / COREREC_BOT_PRIVATE_KEY are missing), so this run does nothing."

      - uses: actions/checkout@v4  # base branch only, for bot.py

      - id: token
        if: env.HAS_KEY == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COREREC_BOT_APP_ID }}
          private-key: ${{ secrets.COREREC_BOT_PRIVATE_KEY }}

      - name: Check the PR
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python .github/corerec_bot/bot.py triage
